[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhop_core"
version = "1.1.3.dev25"
authors = [
    {name = "Rightup", email = "rightup@openhop.dev"},
]
description = "A Python MeshCore library with SPI LoRa radio support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: System :: Networking",
]
keywords = ["mesh", "networking", "lora", "radio", "iot", "communication"]
dependencies = [
    "pycryptodome>=3.23.0",
    "PyNaCl>=1.5.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
radio = ["pyserial>=3.5"]
hardware = [
    "python-periphery>=2.4.1",
    "spidev>=3.5; sys_platform != 'darwin'",
    "pyserial>=3.5",
    "pyusb>=1.2.1",
]

gpiod = ["gpiod>=2.4.0"]

websocket = [
    "websockets>=11.0.0",
]
# Everything the test suite needs, and nothing that constrains the Python
# version -- this must stay installable on every version in requires-python
# so CI can run the suite across the whole matrix.
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pyserial>=3.5",
]
# The full local toolchain. Note this pulls in black, which requires Python
# 3.10+.
dev = [
    "openhop_core[test]",
    "black>=26.5.1",
    "isort>=5.12.0",
    "flake8>=7.1.1",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
all = ["openhop_core[hardware,websocket,dev]"]

[project.urls]
Homepage = "https://github.com/openhop-dev/openhop-core/"
Documentation = "https://docs.openhop.dev/projects/openhop-core/"
Repository = "https://github.com/openhop-dev/openhop-core.git"
Issues = "https://github.com/openhop-dev/openhop-core/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["openhop_core*"]
exclude = ["__pycache__*", "*.pyc", "*.pyo"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

# flake8 does not read pyproject.toml without a plugin, so its configuration
# lives in .flake8 at the repo root -- the one place both a bare `flake8` run
# and the pre-commit hook will pick it up.

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
